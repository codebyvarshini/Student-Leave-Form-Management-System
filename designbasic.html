<html>
<head>
<style>
     
        /* Basic styles for body */
        body {
            font-family: 'Roboto', sans-serif; /* Professional font */
            background-color: #f4f4f9; /* Light, clean background color */
            margin: 0;
            padding: 0;
            color: #333; /* Dark text for readability */
        }

        /* Header styles */
        h1 {
            font-size: 36px;
            color: #2c3e50;
            text-align: center;
            margin-top: 50px;
            padding-bottom: 10px;
            font-weight: 600;
        }

        /* Styling for navigation bar */
        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            background-color: #34495e; /* Dark background for navigation */
            overflow: hidden;
        }

        ul li {
            display: inline-block;
        }

        ul li a {
            display: block;
            color: #ecf0f1; /* Light color for links */
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 500;
            transition: background-color 0.3s;
        }

        ul li a:hover {
            background-color: #2980b9; /* Hover effect with blue */
        }
ul {
    list-style-type: none;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #333;
}

li {
    float: left;
}

li a, .dropbtn {
    display: inline-block;
    color: white;
    text-align: center;
    padding: 14px 16px;
    text-decoration: none;
}

li a:hover, .dropdown:hover .dropbtn {
    background-color: red;
}

li.dropdown {
    display: inline-block;
}

.dropdown-content {
    display: none;
    position: absolute;
    background-color: #f9f9f9;
    min-width: 160px;
    box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
}

.dropdown-content a {
    color: black;
    padding: 12px 16px;
    text-decoration: none;
    display: block;
    text-align: left;
}

.dropdown-content a:hover {background-color: #f1f1f1}

.dropdown:hover .dropdown-content {
    display: block;
}
</style>
</head>
